name: CI

# Build → test → (only if every test passes) promote to the `production` branch → Netlify publishes it
# → test the live site. Netlify only deploys the `production` branch, so untested code can't go live.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *' # 1st of every month: re-test the live site
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  LIVE_URL: https://bevan-test-engineering.netlify.app

jobs:
  test:
    name: Build and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run Playwright tests (quality gate)
        run: npx playwright test
      - name: Summarise test results for the Quality page
        if: ${{ !cancelled() }}
        run: node scripts/quality-summary.mjs quality-results.json
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload results summary
        uses: actions/upload-artifact@v5
        with:
          name: quality-results
          path: quality-results.json
          retention-days: 7

  promote:
    name: Release to production
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: quality-results
      - name: Commit the test results and push the tested version to production
        run: |
          mv quality-results.json public/quality/results.json
          passed=$(jq '.stats.passed' public/quality/results.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/quality/results.json
          git commit -m "Release ${GITHUB_SHA::7}: ${passed} tests passed"
          git push --force origin HEAD:production
          echo "Released ${GITHUB_SHA::7} to the production branch (${passed} tests passed)." >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Test the live site
    needs: [test, promote]
    if: >-
      ${{ !cancelled() && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        needs.promote.result == 'success'
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Wait for Netlify to publish this release
        if: needs.promote.result == 'success'
        run: |
          for i in $(seq 1 60); do
            live=$(curl -sf "$LIVE_URL/quality/results.json?nocache=$RANDOM" | jq -r '.commit // empty' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "Release ${GITHUB_SHA::7} is live."; exit 0; fi
            echo "Live site is on '${live:-no results}', waiting for ${GITHUB_SHA::7}…"
            sleep 10
          done
          echo "::error::The release did not appear on the live site within 10 minutes. Is Netlify's production branch set to 'production'?"
          exit 1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The build provides the sitemap the tests use to discover every page.
      - run: npm run build
      - name: Run Playwright tests against the live site
        run: npx playwright test
        env:
          BASE_URL: ${{ env.LIVE_URL }}
      - name: Upload live test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: live-playwright-report
          path: playwright-report
          retention-days: 14
